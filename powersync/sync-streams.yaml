# ============================================================
# TheCollector — PowerSync Sync Streams (phase 2)
# Per-user streams; auto_subscribe = offline-first sync-all on
# connect. Deployed via the PowerSync dashboard.
# ============================================================

config:
  edition: 3

streams:
  user_collections:
    auto_subscribe: true
    query: SELECT * FROM collections WHERE user_id = auth.user_id()

  user_items:
    auto_subscribe: true
    query: SELECT * FROM items WHERE user_id = auth.user_id()

  user_photos:
    auto_subscribe: true
    query: SELECT * FROM photos WHERE user_id = auth.user_id()

  # P7-T1 — value-history trail; deploy via the PowerSync dashboard
  # alongside the streams above (same edition-3 config).
  user_item_value_history:
    auto_subscribe: true
    query: SELECT * FROM item_value_history WHERE user_id = auth.user_id()
